<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gride display</title>

    <style>

        .container {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 80px 3fr 60px;
            grid-template-areas:
            "header header"
            "sidebar main"
            "footer footer";

            gap: 15px;
            min-height: 500px;

    }

    /* Header */

    .header {

        grid-area: header;
        background-color: navy;
        color: white;
        padding: 20px;
        text-align: center;
    }

    /* Sidebar */

    .sidebar {
        grid-area: sidebar;
        background-color: lightblue;
        padding: 20px;
    }

    /* Main Content */

    .main {
        grid-area: main;
        background-color: lightyellow;
        padding: 20px;
    }

    /* Cards Grid */

    .cards {
        display: grid;
        grid-template-columns:
        repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        justify-items: stretch;
        align-items: stretch;

    }

    /* Individual Cards */

    .card {
        background-color: steelblue;
        color: white;
        padding: 25px;
        text-align: center;
    }

    /* Featured Card */

    .featured {
        grid-column: span 2;
        justify-self: center;
        align-self: center;

    }

    /* Footer */

    .footer {
        grid-area: footer;
        background-color: lightgray;
        text-align: center;
        padding: 15px;
    }

    /* Responsive Design */

    @media (max-width: 600px) {

 .container {

    grid-template-columns: 1fr;
    grid-template-rows: auto;
    grid-template-areas:
        "header"
        "sidebar"
        "main"
        "footer";

 }

 .featured {
   grid-column: span 1;
 }

    }

  </style>
</head>
<body>
    
 <div class="container">
    <header class="header">
         College Dashboard
    </header>
    <aside class="sidebar">
        <h3>Menu</h3>
        <p>Home</p>
        <p>Students</p>
    <p>Courses</p>
    <p>Reports</p>
    </aside>
 <main class="main">
            <h2>Dashboard Information</h2>
            <div class="cards">
            <div class="card">Students</div>
            <div class="card">Faculty</div>
            <div class="card">Courses</div>
            <div class="card">Results</div>
            <div class="card featured">
        Overall Performance
            </div>
            </div>
    </main>
            <footer class="footer">
            College Dashboard Footer
            </footer>
</body>
</html>
