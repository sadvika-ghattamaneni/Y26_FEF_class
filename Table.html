<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <h1>HTML Table Tag Examples</h1>

<table border="1" style="text-align: center;" >
    <caption>Student Marks Details </caption>
    <colgroup>
        <col style="background-color: rgb(209, 249, 236);">
        <col style="background-color: rgb(238, 199, 199);">
        <col style="background-color: lightyellow;">

        
    </colgroup>
    <thead>
    <tr>
        <th>Student Name</th>
         <th>Subject</th>
         <th>Marks</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td rowspan="2" >Yasaswini</td>
        <td>Maths</td>
        <td>92</td>
    </tr>

        <tr>
        
        <td>Science</td>
        <td>100</td>
    </tr>

    <tr>
        <td rowspan="2">Sadvika</td>
        <td>Maths</td>
        <td>78</td>
    </tr>

        <tr>
        
        <td>Science</td>
        <td>96</td>
    </tr>
    </tbody>
    <tfoot>
    <tr>
        <th colspan="2">Total Students</th>
        
        <td>2</td>
    </tr>
    </tfoot>
</table>

</body>
</html>
